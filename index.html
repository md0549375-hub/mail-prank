<!doctype html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Güvenlik Kontrolü</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111;color:#fff;font-family:system-ui,sans-serif;text-align:center}main{padding:30px;max-width:520px;width:calc(100% - 60px)}h1{font-size:42px}p{font-size:20px;line-height:1.5}button{padding:14px 22px;border:0;border-radius:12px;font-size:18px;cursor:pointer}.bar{width:100%;height:14px;background:#333;border-radius:99px;overflow:hidden;margin:24px 0 12px}.fill{height:100%;width:0;background:#fff;transition:width .2s linear}</style></head><body><main id="main"><h1>Güvenlik Kontrolü</h1><p>Hesap güvenlik durumunuz kontrol ediliyor...</p><button onclick="prank()">Devam Et</button></main><script>function prank(){const main=document.getElementById('main');main.innerHTML='<h1>Kontrol ediliyor...</h1><p>Lütfen bekleyin, güvenlik taraması devam ediyor.</p><div class="bar"><div class="fill" id="fill"></div></div><div id="percent">0%</div>';const fill=document.getElementById('fill'),percent=document.getElementById('percent');let progress=0;const timer=setInterval(()=>{progress++;fill.style.width=progress+'%';percent.textContent=progress+'%';if(progress>=100){clearInterval(timer);setTimeout(()=>{main.innerHTML='<h1>TEZGAHLANDIN KARDEŞ 💀</h1><p>Hadi oyununa dön.</p>'},300)}},250)}</script></body></html>
